<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨尔本国庆之旅 · 路线规划</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --ink: #1e293b;
    --ink-2: #64748b;
    --line: #e2e8f0;
    --brand: #0f766e;
    --brand-ink: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    background: linear-gradient(120deg, #0f766e, #115e59);
    color: #fff; padding: 10px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 1000;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 12px; opacity: .85; }
  header .actions { margin-left: auto; display: flex; gap: 8px; }
  header button {
    background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,.28); }

  /* ---------- 天数 Tab ---------- */
  #tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px;
    background: #fff; border-bottom: 1px solid var(--line); z-index: 900;
    scrollbar-width: thin;
  }
  .tab {
    flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab.active { color: #fff; border-color: transparent; font-weight: 600; }
  .tab:hover { transform: translateY(-1px); }

  /* ---------- 主区域 ---------- */
  #app { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 330px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar { flex: 1; overflow-y: auto; padding: 12px; }

  #map { flex: 1; min-width: 0; }
  #map.adding { cursor: crosshair; }

  /* ---------- 侧栏内容 ---------- */
  .day-head { margin-bottom: 10px; }
  .day-head h2 { font-size: 16px; margin-bottom: 4px; }
  .day-head .muted { font-size: 12px; color: var(--ink-2); }
  .day-note {
    background: #ecfeff; border: 1px solid #a5f3fc; color: #155e75;
    border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.6; margin-bottom: 10px;
  }
  .day-stats {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .stat {
    flex: 1; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px; text-align: center;
  }
  .stat b { display: block; font-size: 15px; color: var(--brand); }
  .stat span { font-size: 11px; color: var(--ink-2); }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 4px; position: relative;
    box-shadow: 0 1px 3px rgba(15,23,42,.05);
  }
  .card .row1 { display: flex; align-items: center; gap: 8px; }
  .card .badge {
    width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .card .name { font-weight: 600; font-size: 14px; flex: 1; cursor: pointer; }
  .card .tag {
    font-size: 10px; padding: 1px 7px; border-radius: 999px; flex: none;
  }
  .card .tag.blueprint { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
  .card .tag.custom { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .card .type-line { font-size: 11px; color: var(--ink-2); margin: 5px 0 0 32px; }
  .card .desc {
    font-size: 12px; color: #475569; line-height: 1.65; margin: 6px 0 0 32px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .desc.open { -webkit-line-clamp: unset; }
  .card .ops {
    position: absolute; right: 10px; bottom: 8px; display: none; gap: 4px;
  }
  .card:hover .ops { display: flex; }
  .card .ops button {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    width: 24px; height: 24px; cursor: pointer; font-size: 12px; color: var(--ink-2);
  }
  .card .ops button:hover { background: #f1f5f9; color: var(--ink); }
  .card .ops button.del:hover { background: #fee2e2; color: #b91c1c; }

  .leg-pill {
    display: flex; justify-content: center; margin: 6px 0;
  }
  .leg-pill span {
    font-size: 11px; color: #475569; background: #f8fafc;
    border: 1px dashed #cbd5e1; border-radius: 999px; padding: 2px 10px;
  }

  .overview-item {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center;
  }
  .overview-item:hover { border-color: #94a3b8; }
  .overview-item.sel { background: #f0fdfa; }
  .overview-item .bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .overview-item .oi-main { flex: 1; }
  .overview-item .oi-title { font-size: 14px; font-weight: 600; }
  .overview-item .oi-sub { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .overview-item .oi-check { width: 18px; text-align: center; color: #0f766e; font-weight: 700; flex: none; }
  .overview-item .oi-detail {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    font-size: 11px; padding: 3px 10px; cursor: pointer; color: var(--ink-2); flex: none;
  }
  .overview-item .oi-detail:hover { color: var(--brand); border-color: var(--brand); }
  .ov-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .ov-tools .ov-sum { font-size: 11px; color: var(--brand); flex: 1; }
  .ov-tools button {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    font-size: 11px; padding: 2px 10px; cursor: pointer; color: var(--ink-2);
  }
  .ov-tools button:hover { color: var(--brand); border-color: var(--brand); }

  #addBar { padding: 10px 12px; border-top: 1px solid var(--line); background: #fff; }
  #addBtn {
    width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
  }
  #addBtn.adding { background: #b91c1c; }
  #addHint { text-align: center; font-size: 11px; color: var(--ink-2); margin-top: 6px; }

  /* ---------- 地图 Pin ---------- */
  .pin {
    width: 28px; height: 28px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; border: 2.5px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .pin.small { width: 12px; height: 12px; border-width: 2px; font-size: 0; }
  .pin.custom-pin { border-style: dashed; }
  .pin.pin-start { box-shadow: 0 0 0 4px rgba(15, 118, 110, .28), 0 2px 6px rgba(0, 0, 0, .35); }
  .leaflet-tooltip.qty {
    background: rgba(255,255,255,.92); border: 1px solid var(--line); color: #334155;
    font-size: 11px; padding: 1px 6px; border-radius: 6px; box-shadow: none; font-weight: 600;
  }
  .leaflet-tooltip.qty::before { display: none; }

  .route-legend {
    background: rgba(255,255,255,.92); border-radius: 8px; padding: 6px 10px;
    font-size: 11px; color: #334155; box-shadow: 0 1px 4px rgba(0,0,0,.18); line-height: 1.9;
  }
  .route-legend .sw {
    display: inline-block; width: 22px; border-top: 3px solid #475569;
    vertical-align: middle; margin-right: 6px; border-radius: 2px;
  }
  .route-legend .sw.dash { border-top-style: dashed; }
  .route-legend .sw.ferry { border-top-style: dotted; border-top-color: #0284c7; }

  .popup-body { max-width: 240px; }
  .popup-body h4 { font-size: 14px; margin-bottom: 2px; }
  .popup-body .p-type { font-size: 11px; color: var(--ink-2); margin-bottom: 6px; }
  .popup-body .p-desc { font-size: 12px; line-height: 1.6; color: #475569; }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 2000;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-mask[hidden] { display: none; }
  .modal {
    background: #fff; border-radius: 14px; width: 460px; max-width: 100%;
    max-height: 90vh; overflow-y: auto; padding: 18px;
  }
  .modal h3 { font-size: 16px; margin-bottom: 12px; }
  .modal label { display: block; font-size: 12px; color: var(--ink-2); margin: 10px 0 4px; }
  .modal input[type=text], .modal select, .modal textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-family: inherit; background: #fff;
  }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal .coord-tag { font-size: 12px; color: var(--brand); background: #f0fdfa; border-radius: 6px; padding: 4px 8px; display: inline-block; }
  .search-row { display: flex; gap: 6px; }
  .search-row input { flex: 1; }
  .search-row button {
    border: none; background: #e2e8f0; border-radius: 8px; padding: 0 14px; cursor: pointer; font-size: 13px;
  }
  .search-results { margin-top: 6px; }
  .search-results .sr {
    padding: 6px 8px; border-radius: 8px; font-size: 12px; cursor: pointer; line-height: 1.5;
  }
  .search-results .sr:hover { background: #f1f5f9; }
  .search-results .sr .sr-sub { color: var(--ink-2); font-size: 11px; }
  .modal .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .btn-row button {
    border-radius: 8px; padding: 8px 18px; font-size: 13px; cursor: pointer; border: none;
  }
  .btn-cancel { background: #f1f5f9; color: var(--ink); }
  .btn-save { background: var(--brand); color: #fff; font-weight: 600; }

  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; font-size: 13px; border-radius: 999px;
    padding: 8px 18px; z-index: 3000; box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 760px) {
    #app { flex-direction: column; }
    aside { width: 100%; max-height: 45%; order: 2; border-right: none; border-top: 1px solid var(--line); }
    #map { order: 1; min-height: 55%; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🧳 墨尔本国庆之旅 · 路线规划</h1>
    <div class="sub">4 人同行 · 2026/9/30 - 10/7 · 蓝本框架 + 组员打卡点</div>
  </div>
  <div class="actions">
    <button onclick="exportJson()">📥 导出</button>
    <button onclick="document.getElementById('importFile').click()">📤 导入</button>
    <button onclick="resetBlueprint()">↺ 恢复蓝本</button>
    <input type="file" id="importFile" accept=".json" hidden onchange="importJson(this)">
  </div>
</header>

<div id="tabs"></div>

<div id="app">
  <aside>
    <div id="sidebar"></div>
    <div id="addBar">
      <button id="addBtn" onclick="toggleAddMode()">➕ 点击地图添加打卡点</button>
      <div id="addHint">新增点会自动插入最顺路的位置，饭店 / 景点 / 咖啡店均可</div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<!-- 添加 / 编辑地点模态框 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <h3 id="modalTitle">添加打卡点</h3>
    <span class="coord-tag" id="modalCoord">尚未选择坐标</span>

    <label>🔍 按名称搜索地点（澳大利亚范围内，搜到自动填坐标）</label>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="如：Flinders Street Station / Lunch 莫宁顿">
      <button onclick="doSearch()">搜索</button>
    </div>
    <div class="search-results" id="searchResults"></div>

    <label>名称 *</label>
    <input type="text" id="fName" placeholder="如：Uncle 丹德农街店 · 早午餐">
    <label>类型</label>
    <select id="fType"></select>
    <label>简介（会显示在路线旁的卡片上）</label>
    <textarea id="fDesc" placeholder="写点什么：为什么想去 / 招牌菜 / 营业时间 / 谁推荐的…"></textarea>

    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

/* ================= 类型 / 蓝本数据 ================= */

const TYPES = {
  sight:    { label: "景点打卡", icon: "📸", color: "#e11d48" },
  nature:   { label: "自然风光", icon: "🌊", color: "#0284c7" },
  food:     { label: "餐厅美食", icon: "🍽️", color: "#ea580c" },
  cafe:     { label: "咖啡茶饮", icon: "☕", color: "#b45309" },
  shopping: { label: "购物",     icon: "🛍️", color: "#db2777" },
  hotel:    { label: "住宿",     icon: "🏨", color: "#7c3aed" },
  traffic:  { label: "交通枢纽", icon: "✈️", color: "#475569" },
};

// 蓝本行程（坐标为 WGS-84，可在地图上拖动微调）
function P(name, type, lat, lng, desc, opts) {
  return { id: "bp_" + Math.random().toString(36).slice(2, 9), name, type, coords: [lat, lng], desc, blueprint: true, ...opts };
}
const HOTEL = () => P("Holiday Inn 伯克街假日酒店", "hotel", -37.8152, 144.9548,
  "全程市内落脚点（296 Little Collins St）。位于 CBD 核心，步行可达伯克街购物中心、皇家拱廊，去南十字星车站乘 SkyBus 也很方便。");

const BLUEPRINT = {
  trip: "墨尔本国庆之旅",
  days: [
    {
      id: "d1", date: "9/30 周三", title: "香港 ✈ 墨尔本 · 抵达日", color: "#0ea5e9",
      note: "航班 11:20 起飞 / 22:15 落地 T2（飞行约 9 小时）。落地后取行李过海关，推荐 SkyBus 机场大巴直达南十字星车站（约 30 分钟）再步行/打车到酒店。",
      places: [
        P("香港国际机场 T1", "traffic", 22.3080, 113.9185, "11:20 起飞，国泰/澳航直飞墨尔本。"),
        P("墨尔本机场 T2", "traffic", -37.6690, 144.8410, "22:15 落地。入境请留好返程机票酒店单，T2 到达层出门即是 SkyBus 乘车点。"),
        HOTEL(),
      ],
    },
    {
      id: "d2", date: "10/1 周四", title: "墨尔本市区 · 步行漫游日", color: "#10b981",
      note: "市区日全程可步行 + 免费环城电车（City Circle Tram 35 路免费绕 CBD 一圈）。倒时差别排太满，傍晚雅拉河边吃晚餐看日落。",
      places: [
        HOTEL(),
        P("维多利亚州立图书馆", "sight", -37.8098, 144.9650, "百年地标，著名的八角形穹顶阅览室免费开放。门前草坪是本地人晒太阳圣地。"),
        P("皇家拱廊 Royal Arcade", "sight", -37.8117, 144.9634, "澳洲最古老的拱廊（1869），玻璃穹顶 + 精品店，里面有家很有名的魔法商店。"),
        P("联合小巷涂鸦街", "sight", -37.8127, 144.9623, "Union Lane，CBD 最出片的涂鸦小巷，作品每周都在换，转身即到伯克街购物中心。"),
        P("弗林德斯街车站", "sight", -37.8183, 144.9671, "墨尔本门面级地标，黄铜穹顶钟楼。对角就是联邦广场，路口是全城最经典的机位。"),
        P("联邦广场 Federation Square", "sight", -37.8179, 144.9691, "城市客厅，常有免费展览和活动。旁边圣保罗大教堂可顺路参观。"),
      ],
    },
    {
      id: "d3", date: "10/2 周五", title: "莫宁顿半岛 · 轮渡过湾一日游", color: "#f59e0b",
      note: "今天不走回头路：沿半岛一路玩到索伦托，坐 Searoad 车渡横跨菲利普湾（约 40 分钟）到昆斯克里夫，看完朗斯代尔角灯塔穿过吉朗海滨，走 M1 高速过西门大桥回市区。渡轮旺季建议提前网上购票；春季（10 月）是半岛最好的季节，记得带防晒。",
      places: [
        HOTEL(),
        P("布莱顿彩虹小屋", "nature", -37.9161, 144.9868, "82 座彩色更衣棚沿滩排开，墨尔本最经典的明信片机位，顺路第一站。"),
        P("莫宁顿小镇主街", "food", -38.2216, 145.0389, "Mornington Main Street 海边小镇，咖啡馆和早午餐店密集，适合歇脚吃午饭。"),
        P("亚瑟座山观景台", "nature", -38.3520, 144.9490, "半岛制高点，可俯瞰菲利普湾全景，观景塔 + 缆车 + 迷宫花园。"),
        P("索伦托 Sorrento", "nature", -38.3396, 144.7382, "石灰岩海岸小镇，逛完主街前往轮渡码头，乘 Searoad 渡轮过湾到对岸的昆斯克里夫。"),
        P("索伦托轮渡码头", "traffic", -38.33611, 144.74574, "Searoad Ferries 索伦托侧码头，连人带车横跨菲利普湾（约 40 分钟，班次密集，旺季建议提前购票）。"),
        P("昆斯克里夫 Queenscliff", "sight", -38.26561, 144.67250, "渡轮靠岸的维多利亚式海港小镇，有海事博物馆和黑色灯塔要塞，码头边咖啡馆适合小憩。", { ferry: true }),
        P("朗斯代尔角灯塔", "sight", -38.29201, 144.61392, "Point Lonsdale Lighthouse，守在菲利普港湾入口「怒涛之门 The Rip」西侧，湾内湾外的分界点，可预约导览登塔。"),
        P("吉朗海滨 Eastern Beach", "nature", -38.1447, 144.3642, "回程顺路穿过吉朗壮丽的海滨一线（海边木雕人偶 + 旋转木马），补给后上 M1 高速。"),
        P("西门大桥 West Gate Bridge", "traffic", -37.82527, 144.88757, "M1 高速跨亚拉河的标志大桥，墨尔本西侧门户，过桥即进入市区。"),
        HOTEL(),
      ],
    },
    {
      id: "d4", date: "10/3 周六", title: "大洋路（上）· 吉朗 → 阿波罗湾", color: "#ef4444",
      note: "今天住阿波罗湾，建议 8 点前出发。周六大洋路车流量大，观景台停车要眼疾手快。",
      places: [
        HOTEL(),
        P("吉朗 Eastern Beach", "nature", -38.1447, 144.3642, "大洋路门户城市，海边木雕人偶（Baywalk Bollards）+ 海滨步道，适合第一站伸展腿脚。"),

// 境外瓦片服务加载失败时自动重试（带退避），避免永久灰块
function attachTileRetry(layer, maxRetries) {
  const tries = new Map();
  layer.on("tileerror", e => {
    const src = e.tile.src;
    if (!src || src.startsWith("data:")) return;
    const n = (tries.get(src) || 0) + 1;
    if (n > maxRetries) return;
    tries.set(src, n);
    setTimeout(() => {
      e.tile.src = src + (src.includes("?") ? "&" : "?") + "retry=" + n;
    }, 700 * n);
  });
}
[esriStreetLayer, satelliteLayer, tdVec, tdVecLabel, tdImg, tdImgLabel].forEach(l => attachTileRetry(l, 3));

/* ================= 路线计算（OSRM，失败降级直线） ================= */

function haversine(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// 新增点插入哪个位置最顺路：枚举插入点，取相邻直线距离增量最小者（不插在首位之前）
function bestInsertIndex(day, coords) {
  const pts = day.places.map(p => p.coords);
  if (pts.length === 0) return 0;
  let bestIdx = pts.length, bestCost = Infinity;
  for (let i = 1; i <= pts.length; i++) {
    const prev = pts[i - 1], next = i < pts.length ? pts[i] : null;
    const before = next ? haversine(prev, next) : 0;
    const after = haversine(prev, coords) + (next ? haversine(coords, next) : 0);
    const cost = after - before;
    if (cost < bestCost) { bestCost = cost; bestIdx = i; }
  }
  return bestIdx;
}

function fallbackRoute(places) {
  const geometry = { type: "LineString", coordinates: places.map(p => [p.coords[1], p.coords[0]]) };
  const legs = [];
  for (let i = 0; i < places.length - 1; i++) {
    if (places[i + 1].ferry) {
      const d = haversine(places[i].coords, places[i + 1].coords);
      legs.push({ distance: d, duration: d / (15 / 3.6), ferry: true }); // 渡轮约 15km/h
    } else {
      const d = haversine(places[i].coords, places[i + 1].coords) * 1.3;
      legs.push({ distance: d, duration: d / (65 / 3.6) }); // 按 65km/h 估算
    }
  }
  return { geometry, legs, approx: true };
}

// 返程判定：优先找“末尾长途折返”——末段方向与出发方向相反（>120°）且 >50km 的连续段，
// 典型如大洋路玩完一路高速回城；环线日（首尾同点）则退回“离首站最远处为折返点”（5km 粒度取最后一个）。
// 最远点就是末站（单程线）时没有返程段
function bearingDeg(a, b) {
  const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;
  const y = Math.sin(rad(b[1] - a[1])) * Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0])) * Math.sin(rad(b[0])) - Math.sin(rad(a[0])) * Math.cos(rad(b[0])) * Math.cos(rad(b[1] - a[1]));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function angleDiff(a, b) { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }
function returnLegStart(day) {
  const n = day.places.length;
  if (n < 3) return n;
  const initB = bearingDeg(day.places[0].coords, day.places[1].coords);
  let i = n - 2;
  while (i >= 1) {
    const a = day.places[i].coords, b = day.places[i + 1].coords;
    if (haversine(a, b) > 50000 && angleDiff(bearingDeg(a, b), initB) > 120) i--;
    else break;
  }
  if (i < n - 2) return i + 1;
  if (haversine(day.places[0].coords, day.places[n - 1].coords) < 300) {
    let maxB = -1, idx = 0;
    day.places.forEach((p, k) => {
      const bkt = Math.floor(haversine(day.places[0].coords, p.coords) / 5000);
      if (k > 0 && k < n - 1 && bkt >= maxB) { maxB = bkt; idx = k; }
    });
    if (idx > 0) return idx;
  }
  return n;
}

// 把整条路线几何按站点切成逐段折线，供去程/返程分别着色。
// 每站取路线上离它最近的顶点（先遇到者，避免环形线把去程切成回程），末站固定取终点
function splitLegGeometries(r, places) {
  if (!r.geometry) return [];
  const coords = r.geometry.coordinates;
  if (coords.length < 2 || places.length < 2) return [];
  const nearest = p => {
    let best = 0, bestD = Infinity;
    for (let j = 0; j < coords.length; j++) {
      const dx = coords[j][0] - p.coords[1], dy = coords[j][1] - p.coords[0];
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = j; }
    }
    return best;
  };
  const cuts = [0];
  for (let i = 1; i < places.length; i++) {
    const c = i === places.length - 1 ? coords.length - 1 : nearest(places[i]);
    cuts.push(Math.min(Math.max(c, cuts[i - 1]), coords.length - 1));
  }
  const legs = [];
  for (let i = 0; i < places.length - 1; i++) {
    const from = cuts[i];
    const to = i + 1 < cuts.length
      ? Math.min(Math.max(cuts[i + 1] + 1, from + 1), coords.length)
      : coords.length;
    legs.push(coords.slice(from, to));
  }
  return legs;
}

async function osrmRoute(places) {
  const coords = places.map(p => `${p.coords[1].toFixed(6)},${p.coords[0].toFixed(6)}`).join(";");
  const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  if (json.code !== "Ok" || !json.routes || !json.routes.length) throw new Error(json.code);
  return json.routes[0];
}

async function computeRoute(day) {
  const places = day.places;
  if (places.length < 2) return { geometry: null, legs: [], approx: false };
  // 带 ferry:true 的站表示"到达该站的这一段是轮渡"（如索伦托→昆斯克里夫过湾）：
  // 按轮渡边界切块，逐块算驾车路线，轮渡段用直线相连
  const starts = [0];
  for (let i = 1; i < places.length; i++) if (places[i].ferry) starts.push(i);
  const allCoords = [];
  const legs = [];
  let approx = false;
  for (let k = 0; k < starts.length; k++) {
    const from = starts[k];
    const to = k + 1 < starts.length ? starts[k + 1] : places.length;
    const chunk = places.slice(from, to);
    if (chunk.length >= 2) {
      try {
        const route = await osrmRoute(chunk);
        const coords = route.geometry.coordinates;
        if (allCoords.length) coords.shift(); // 去掉与上一段衔接处重复的顶点
        allCoords.push(...coords);
        for (const l of route.legs) legs.push({ distance: l.distance, duration: l.duration });
      } catch (e) {
        console.warn("OSRM 不可用，使用直线估算：", e.message);
        approx = true;
        const fb = fallbackRoute(chunk);
        if (allCoords.length) fb.geometry.coordinates.shift();
        allCoords.push(...fb.geometry.coordinates);
        legs.push(...fb.legs);
      }
    }
    if (k + 1 < starts.length) {
      const a = places[to - 1], b = places[to];
      const d = haversine(a.coords, b.coords);
      if (!allCoords.length) allCoords.push([a.coords[1], a.coords[0]]);
      allCoords.push([b.coords[1], b.coords[0]]);
      legs.push({ distance: d, duration: d / (15 / 3.6), ferry: true });
    }
  }
  if (!allCoords.length) return { geometry: null, legs: [], approx };
  return { geometry: { type: "LineString", coordinates: allCoords }, legs, approx };
}

const routePending = new Map();   // dayId -> 进行中的请求，避免并发重复调用
async function routeFor(day) {
  if (routeCache.has(day.id)) return routeCache.get(day.id);
  if (routePending.has(day.id)) return routePending.get(day.id);
  const task = computeRoute(day).then(r => { routeCache.set(day.id, r); return r; });
  routePending.set(day.id, task);
  return task.finally(() => routePending.delete(day.id));
}
function invalidateRoute(dayId) { routeCache.delete(dayId); }

}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  const items = [{ id: "overview", date: "总览", title: "全部行程", color: "#475569" }, ...state.days];
  tabs.innerHTML = "";
  for (const d of items) {
    const b = document.createElement("button");
    b.className = "tab" + (currentDayId === d.id ? " active" : "");
    b.style.background = currentDayId === d.id ? d.color : "#fff";
    b.innerHTML = `<span class="dot" style="background:${currentDayId === d.id ? "#fff" : d.color}"></span>${d.date}`;
    b.onclick = () => { currentDayId = d.id; render(); };
    tabs.appendChild(b);
  }
}

function toggleHighlight(dayId) {
  if (highlightIds.has(dayId)) highlightIds.delete(dayId);
  else highlightIds.add(dayId);
  render();
}

  highlightIds = on ? new Set(state.days.map(d => d.id)) : new Set();

}

  return m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m";
}
function fmtDur(s) {
  const min = Math.round(s / 60);
  if (min < 60) return "约 " + min + " 分钟";
  return "约 " + Math.floor(min / 60) + " 小时 " + (min % 60 ? (min % 60) + " 分" : "");
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function renderSidebar(seq) {
  const el = document.getElementById("sidebar");
  if (currentDayId === "overview") {
    const routes = await Promise.all(state.days.map(d => routeFor(d)));
    if (seq !== renderSeq) return;
    const sumD = r => r.legs.reduce((s, l) => s + l.distance, 0);
    const sumT = r => r.legs.reduce((s, l) => s + l.duration, 0);
    const selD = routes.reduce((s, r, i) => s + (highlightIds.has(state.days[i].id) ? sumD(r) : 0), 0);
    const selT = routes.reduce((s, r, i) => s + (highlightIds.has(state.days[i].id) ? sumT(r) : 0), 0);
    el.innerHTML = `<div class="day-head"><h2>🗺️ 行程总览</h2>
      <div class="muted">${state.days.length} 天 · ${state.days.reduce((n, d) => n + d.places.length, 0)} 个地点 · 点击日期可勾选多天，地图同时高亮所选路线</div>
      <div class="ov-tools">
        <span class="ov-sum">${highlightIds.size ? `已选 ${highlightIds.size} 天 · 合计 ${fmtDist(selD)} · 车程 ${fmtDur(selT)}` : "未勾选 · 默认展示全部路线"}</span>
        <button onclick="selectAllDays(true)">全选</button>
        <button onclick="selectAllDays(false)">清空</button>
      </div></div>`;
    state.days.forEach((d, i) => {
      const r = routes[i];
      const sel = highlightIds.has(d.id);
      const div = document.createElement("div");
      div.className = "overview-item" + (sel ? " sel" : "");
      div.style.borderColor = sel ? d.color : "";
      div.innerHTML = `<div class="bar" style="background:${d.color}"></div>
        <div class="oi-main"><div class="oi-title">${esc(d.date)} · ${esc(d.title)}</div>
        <div class="oi-sub">${d.places.length} 站 · ${fmtDist(sumD(r))} · 车程 ${fmtDur(sumT(r))}</div></div>
        <div class="oi-check">${sel ? "✓" : ""}</div>
        <button class="oi-detail" title="查看单日详情">详情</button>`;
      div.onclick = () => toggleHighlight(d.id);
      div.querySelector(".oi-detail").onclick = e => { e.stopPropagation(); currentDayId = d.id; render(); };
      el.appendChild(div);
    });
    return;
  }

  const day = getDay(currentDayId);
  if (!day) { currentDayId = "overview"; return renderSidebar(seq); }
  const r = await routeFor(day);
  if (seq !== renderSeq) return;
  const totalD = r.legs.reduce((s, l) => s + l.distance, 0);
  const totalT = r.legs.reduce((s, l) => s + l.duration, 0);

  let html = `
    <div class="day-head"><h2>${esc(day.date)} · ${esc(day.title)}</h2>
      <div class="muted">${day.places.length} 个站点${r.approx ? " · ⚠️ 路线服务暂不可用，距离为直线估算" : ""}</div></div>
    ${day.note ? `<div class="day-note">💡 ${esc(day.note)}</div>` : ""}
    <div class="day-stats">
      <div class="stat"><b>${fmtDist(totalD)}</b><span>总里程</span></div>
      <div class="stat"><b>${fmtDur(totalT)}</b><span>总车程</span></div>
    </div>`;

  const retFrom = returnLegStart(day);
  const firstP = day.places[0];
  day.places.forEach((p, i) => {
    const t = TYPES[p.type] || TYPES.sight;
    const isLoopEnd = i === day.places.length - 1 && i > 0 && haversine(firstP.coords, p.coords) < 300;
    const roleTag = i === 0 ? "🚩 起点 · " : isLoopEnd ? "🏁 终点 · " : "";
    html += `
      <div class="card" style="border-left:3px solid ${t.color}">
        <div class="row1">
          <div class="badge" style="background:${t.color}">${isLoopEnd ? "🏁" : i + 1}</div>
          <div class="name" title="点击编辑信息" onclick="openEdit('${day.id}',${i})">${t.icon} ${esc(p.name)}</div>
          <span class="tag ${p.blueprint ? "blueprint" : "custom"}">${p.blueprint ? "蓝本" : "组员新增"}</span>
        </div>
        <div class="type-line">${roleTag}${t.label} · ${p.coords[0].toFixed(4)}, ${p.coords[1].toFixed(4)} · 地图上可拖动微调</div>
        ${p.desc ? `<div class="desc" onclick="this.classList.toggle('open')" title="点击展开/收起">${esc(p.desc)}</div>` : ""}
        <div class="ops">
          <button title="上移" onclick="movePlace('${day.id}',${i},-1)">⬆</button>
          <button title="下移" onclick="movePlace('${day.id}',${i},1)">⬇</button>
          <button class="del" title="删除" onclick="removePlace('${day.id}',${i})">🗑</button>
        </div>
      </div>`;
    if (i < day.places.length - 1 && r.legs[i]) {
      const leg = r.legs[i];
      const isReturn = i >= retFrom;
      const label = leg.ferry
        ? `⛴️ 轮渡段 · ${fmtDist(leg.distance)} · ${fmtDur(leg.duration)}（Searoad 车渡过湾）`
        : leg.distance > 800000
        ? `✈️ 飞行段 · 约 ${fmtDist(leg.distance)}（跨洋示意，非车程）`
        : `${isReturn ? "↩️ 返程 · " : "🚗 "}${fmtDist(leg.distance)} · ${fmtDur(leg.duration)}`;
      html += `<div class="leg-pill"><span>${label}</span></div>`;
    }
  });
  el.innerHTML = html;
}

function markerIcon(p, idx, color, small, shiftX) {
  const shift = shiftX ? `transform:translate(${shiftX}px,0);` : "";
  return L.divIcon({
    className: "",
    html: `<div class="pin ${small ? "small" : ""} ${p.blueprint ? "" : "custom-pin"}${!small && idx === 0 ? " pin-start" : ""}" style="background:${color};${shift}">${small ? "" : idx + 1}</div>`,
    iconSize: small ? [12, 12] : [28, 28],
    iconAnchor: small ? [6, 6] : [14, 14],
  });
}

function bindMarker(m, p, dayId, idx, isLoopEnd) {
  m.bindTooltip(`${isLoopEnd ? "🏁 终点 · " : ""}${idx + 1}. ${p.name}`,
    { direction: isLoopEnd ? "right" : "top", className: "qty", offset: isLoopEnd ? [18, 0] : [0, -12] });
  const t = TYPES[p.type] || TYPES.sight;
  m.bindPopup(`<div class="popup-body"><h4>${t.icon} ${esc(p.name)}</h4>
    <div class="p-type">${t.label} · ${p.blueprint ? "蓝本行程" : "组员新增"}</div>
    ${p.desc ? `<div class="p-desc">${esc(p.desc)}</div>` : ""}</div>`);
  m.on("dragend", function () {
    p.coords = [m.getLatLng().lat, m.getLatLng().lng];
    invalidateRoute(dayId); save(); render();
  });
}

async function renderMap(seq) {
  if (markersLayer) map.removeLayer(markersLayer);
  if (linesLayer) map.removeLayer(linesLayer);
  // 捕获本次渲染的图层引用：迟到的旧渲染只会画进已脱离地图的组，不会污染新视图
  const myMarkers = markersLayer = L.layerGroup().addTo(map);
  const myLines = linesLayer = L.layerGroup().addTo(map);
  const bounds = L.latLngBounds();
  let anyDashed = false;
  let anyFerry = false;

  const drawDay = async (day, opts) => {
    const r = await routeFor(day);
    if (r.geometry) {
      const latlngs = L.GeoJSON.coordsToLatLngs(r.geometry.coordinates);
      const retFrom = returnLegStart(day);
      // 按段绘制：白色描边 + 彩色线；返程虚线；轮渡段蓝色点线且不画描边（避免看着像跨海大桥）
      splitLegGeometries(r, day.places).forEach((geo, i) => {
        if (geo.length < 2) return;
        const isReturn = i >= retFrom;
        const isFerry = r.legs[i] && r.legs[i].ferry;
        if (isReturn) anyDashed = true;
        if (isFerry) anyFerry = true;
        if (!isFerry) {
          L.polyline(L.GeoJSON.coordsToLatLngs(geo), {
            color: "#ffffff",
            weight: (opts.dim ? 2.5 : (opts.small && !opts.hi ? 4 : 8)) + 3.5,
            opacity: opts.dim ? .5 : .9,
          }).addTo(myLines);
        }
        L.polyline(L.GeoJSON.coordsToLatLngs(geo), {
          color: isFerry ? "#0284c7" : day.color,
          weight: opts.dim ? 1.5 : (opts.small && !opts.hi ? 2 : 4.5),
          opacity: opts.dim ? .3 : (opts.small && !opts.hi ? .75 : 1),
          dashArray: isFerry ? "2 10" : isReturn ? "10 7" : (r.approx ? "8 6" : null),
        }).addTo(myLines);
      });
      if (!opts.dim) latlngs.forEach(ll => bounds.extend(ll));
    }
    // 同坐标的站点（如首尾都是酒店）横向错开，保证每个点位都看得见
    const seen = new Map();
    day.places.forEach((p, i) => {
      const key = p.coords[0].toFixed(5) + "," + p.coords[1].toFixed(5);
      const dup = seen.get(key) || 0;
      seen.set(key, dup + 1);
      const isLoopEnd = dup > 0 && i === day.places.length - 1;
      const m = L.marker(p.coords, {
        icon: markerIcon(p, i, TYPES[p.type] ? TYPES[p.type].color : "#334155", opts.small, dup > 0 ? dup * 26 : 0),
        draggable: !!opts.interactive,
        opacity: opts.dim ? .45 : 1,
      }).addTo(myMarkers);
      if (opts.interactive) bindMarker(m, p, day.id, i, isLoopEnd);
      else m.bindTooltip(`${day.date} · ${p.name}`, { direction: "top", className: "qty" });
      if (!opts.dim) bounds.extend(p.coords);
    });
  };

  if (currentDayId === "overview") {
    const hasSel = highlightIds.size > 0;
    for (const d of state.days) {
      const sel = highlightIds.has(d.id);
      await drawDay(d, { small: true, dim: hasSel && !sel, hi: sel });
    }
  } else {
    const day = getDay(currentDayId);
    if (day) await drawDay(day, { small: false, hi: true, interactive: true });
  }
  if (seq !== renderSeq) return;   // 已有更新一次的渲染，放弃本次的视野与图例
  if (bounds.isValid()) map.fitBounds(bounds.pad(0.12));
  updateLegend(anyDashed || anyFerry);
}

/* ================= 添加 / 编辑 ================= */

function toggleAddMode() {
  addingMode = !addingMode;
  document.getElementById("addBtn").classList.toggle("adding", addingMode);
  document.getElementById("addBtn").textContent = addingMode ? "❌ 取消添加（点击地图选点）" : "➕ 点击地图添加打卡点";
  document.getElementById("map").classList.toggle("adding", addingMode);
}

map.on("click", e => {
  if (!addingMode) return;
  addingMode = false;
  document.getElementById("addBtn").classList.remove("adding");
  document.getElementById("addBtn").textContent = "➕ 点击地图添加打卡点";
  document.getElementById("map").classList.remove("adding");
  openModal({ dayId: currentDayId === "overview" ? state.days[0].id : currentDayId, coords: [e.latlng.lat, e.latlng.lng] });
});

function fillTypeSelect(sel) {
  sel.innerHTML = Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join("");
}
fillTypeSelect(document.getElementById("fType"));

function openModal(ctx) {
  modalCtx = ctx;
  document.getElementById("modalTitle").textContent = ctx.index != null ? "编辑打卡点" : "添加打卡点";
  document.getElementById("modalCoord").textContent = `坐标：${ctx.coords[0].toFixed(5)}, ${ctx.coords[1].toFixed(5)}（加入后可在地图上拖动微调）`;
  document.getElementById("searchResults").innerHTML = "";
  document.getElementById("searchInput").value = "";
  if (ctx.index != null) {
    const p = getDay(ctx.dayId).places[ctx.index];
    document.getElementById("fName").value = p.name;
    document.getElementById("fType").value = p.type;
    document.getElementById("fDesc").value = p.desc || "";
  } else {
    document.getElementById("fName").value = "";
    document.getElementById("fType").value = "food";
    document.getElementById("fDesc").value = "";
  }
  document.getElementById("modalMask").hidden = false;
  document.getElementById("fName").focus();
}
function openEdit(dayId, i) { openModal({ dayId, index: i, coords: getDay(dayId).places[i].coords }); }
function closeModal() { document.getElementById("modalMask").hidden = true; modalCtx = null; }

function saveModal() {
  if (!modalCtx) return;
  const name = document.getElementById("fName").value.trim();
  if (!name) { toast("请填写地点名称"); return; }
  const day = getDay(modalCtx.dayId);
  const data = {
    name,
    type: document.getElementById("fType").value,
    desc: document.getElementById("fDesc").value.trim(),
  };
  if (modalCtx.index != null) {
    Object.assign(day.places[modalCtx.index], data);
  } else {
    const idx = bestInsertIndex(day, modalCtx.coords);
    day.places.splice(idx, 0, {
      id: "cp_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ...data, coords: modalCtx.coords, blueprint: false,
    });
    toast(`已插入 ${day.date} 第 ${idx + 1} 站（按顺路原则），路线重算中…`);
  }
  invalidateRoute(day.id);
  save(); closeModal(); render();
}

/* ================= 搜索（Nominatim，仅澳大利亚） ================= */

async function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  const box = document.getElementById("searchResults");
  box.innerHTML = `<div class="sr sr-sub">搜索中…</div>`;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&countrycodes=au&limit=6&accept-language=zh-CN`);
    const list = await res.json();
    if (!list.length) { box.innerHTML = `<div class="sr sr-sub">没有找到结果，可以直接填名称后保存，再拖动 Pin 修正位置</div>`; return; }
    box.innerHTML = "";
    for (const it of list) {
      const div = document.createElement("div");
      div.className = "sr";
      div.innerHTML = `${esc(it.display_name.split(",").slice(0, 2).join(","))}<div class="sr-sub">${esc(it.display_name.split(",").slice(2, 5).join(",").trim())} · ${(+it.lat).toFixed(4)}, ${(+it.lon).toFixed(4)}</div>`;
      div.onclick = () => {
        if (!modalCtx) return;
        modalCtx.coords = [+it.lat, +it.lon];
        document.getElementById("modalCoord").textContent = `坐标：${(+it.lat).toFixed(5)}, ${(+it.lon).toFixed(5)}（来自搜索结果）`;
        if (!document.getElementById("fName").value) {
          document.getElementById("fName").value = it.display_name.split(",")[0];
        }
        box.innerHTML = "";
      };
      box.appendChild(div);
    }
  } catch (e) {
    box.innerHTML = `<div class="sr sr-sub">搜索服务暂不可用，可直接填名称保存后拖动 Pin 定位</div>`;
  }
}
document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

/* ================= 排序 / 删除 ================= */

function movePlace(dayId, i, dir) {
  const arr = getDay(dayId).places;
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  invalidateRoute(dayId); save(); render();
}
function removePlace(dayId, i) {
  const p = getDay(dayId).places[i];
  if (!confirm(`删除「${p.name}」？路线会自动重算。`)) return;
  getDay(dayId).places.splice(i, 1);
  invalidateRoute(dayId); save(); render();
}

/* ================= 导入 / 导出 / 重置 ================= */

function exportJson() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `墨尔本行程-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJson(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.days)) throw new Error("格式不对");
      state = data;
      routeCache.clear();
      save(); render();
      toast("导入成功");
    } catch (e) { toast("导入失败：" + e.message); }
  };
  reader.readAsText(file);
}
function resetBlueprint() {
  if (!confirm("恢复初始蓝本？将丢失所有组员新增和修改。")) return;
  state = JSON.parse(JSON.stringify(BLUEPRINT));
  routeCache.clear();
  save(); render();
  toast("已恢复蓝本");
}

/* ================= 工具 ================= */

let toastTimer = null;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = "none", 2200);
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ================= 启动 ================= */
render();
</script>
